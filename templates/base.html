<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Memoriza{% endblock %}</title>
    <link rel="stylesheet" href="{{url_for('static', filename='style.css')}}">
</head>
<body>
    <nav>
        <img src="{{ url_for('static', filename='Memoriza.png') }}" alt="Memoriza"> 
        <strong><a href="{{ url_for('inicio') }}" class="cabecalho">Início |</a>
        <a href="{{ url_for('ver') }}" class="cabecalho">Lembretes</a> |
        <a href="{{ url_for('logout') }}" class="cabecalho">Sair</a></strong>
    </nav>
    <main>
        {% block content %}
        {% endblock %}
    </main>

    <footer>
    &copy 2026 Memoriza. Todos os direitos reservados. <img src="{{ url_for('static', filename='Caracol.png') }}" alt="Logo Memoriza" id="caracol">
    </footer>

    <script src="{{url_for('static', filename='script.js')}}"></script>
    {% block scripts %}
    {% endblock %}
</body>
</html>
