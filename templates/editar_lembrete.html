{% extends "base.html" %}

{% block title %}Editar Lembrete{% endblock %}

{% block content %}
<section>
    <h1>Editar Lembrete</h1>

    <form id="form_editar" method="post" action="{{ url_for('editar', id=lembrete.id) }}">
        <label for="titulo">Título</label>
        <input type="text" id="titulo" name="titulo" value="{{ lembrete.titulo }}" required>

        <label for="detalhes">Descrição</label>
        <textarea id="detalhes" name="detalhes" rows="4" required>{{ lembrete.detalhes }}</textarea>

        <textarea name="detalhes">{{ lembrete.detalhes }}</textarea>

        <select name="categoria">
            <option value="{{ lembrete.categoria }}">{{ lembrete.categoria }}</option>
            <option value="Faculdade">Faculdade</option>
            <option value="Trabalho">Trabalho</option>
            <option value="Casa">Casa</option>
            <option value="Saúde">Saúde</option>
        </select>

        <select name="prioridade">
            <option value="{{ lembrete.prioridade }}">{{ lembrete.prioridade }}</option>
            <option value="Baixa">Baixa</option>
            <option value="Média">Média</option>
            <option value="Alta">Alta</option>
        </select>

        <input type="date" name="data" value="{{ lembrete.data }}">

        <div class="botoes">
            <button type="submit">Salvar alterações</button>
            <button id="botao_excluir" type="button" class="secundario">Excluir lembrete</button>
        </div>
    </form>
</section>

<script>
document.getElementById('botao_excluir').addEventListener('click', function() {
    if (confirm('Tem certeza que deseja excluir?')) {
        window.location.href = "{{ url_for('excluir', id=lembrete.id) }}";
    }
});
</script>
{% endblock %}
